<svg width="860" height="390" viewBox="0 0 860 390" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient sofisticado e sutil -->
    <linearGradient id="bgLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#080a0f"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>

    <!-- Glows refinados e suaves -->
    <radialGradient id="finazuGlow" cx="20%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0066FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="lofertasGlow" cx="20%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FF5500" stop-opacity="0"/>
    </radialGradient>

    <!-- Borda do card exterior -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#1e293b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Borda sutil de vidro para Finazu -->
    <linearGradient id="borderFinazu" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Borda sutil de vidro para Lofertas -->
    <linearGradient id="borderLofertas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5500" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#1e293b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Grid pontilhado suave de fundo -->
    <pattern id="gridDots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.04"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
  </style>

  <!-- Base com borda suave -->
  <rect x="1" y="1" width="858" height="388" rx="16" fill="url(#bgLinear)" stroke="url(#borderGrad)" stroke-width="1.2"/>
  <rect x="1" y="1" width="858" height="388" rx="16" fill="url(#gridDots)"/>

  <!-- Linha de luz de borda superior perfeitamente alinhada e contida -->
  <line x1="80" y1="1" x2="380" y2="1" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>

  <!-- HEADER -->
  <g transform="translate(40, 36)">
    <!-- Pill 1: Systems Online -->
    <rect x="0" y="0" width="138" height="26" rx="13" fill="#0f1420" stroke="#1e293b" stroke-width="1"/>
    <circle cx="14" cy="13" r="3.5" fill="#10B981"/>
    <text x="26" y="17" class="font-sans" font-size="11" font-weight="600" fill="#E2E8F0" letter-spacing="0.5">SYSTEMS ONLINE</text>

    <!-- Pill 2: Building Products (Largura corrigida: 150px para acomodar o texto com folga) -->
    <rect x="150" y="0" width="150" height="26" rx="13" fill="#0f1420" stroke="#1e293b" stroke-width="1"/>
    <text x="225" y="17" text-anchor="middle" class="font-sans" font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="0.4">BUILDING PRODUCTS</text>

    <!-- Nome Leonardo Castro -->
    <text x="0" y="70" class="font-sans" font-size="30" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">Leonardo Castro</text>
    <text x="0" y="94" class="font-sans" font-size="13" font-weight="400" fill="#94A3B8">
      Software Engineer &amp; Product Creator <tspan fill="#334155">•</tspan> Especialista em aplicações escaláveis, SaaS e ecossistemas web
    </text>
  </g>

  <!-- CARDS DE PRODUTOS -->

  <!-- CARD 1: FINAZU -->
  <g transform="translate(40, 156)">
    <!-- Fundo do Card com borda integrada iluminada -->
    <rect x="0" y="0" width="374" height="152" rx="12" fill="#0c1017" stroke="url(#borderFinazu)" stroke-width="1.2"/>
    <rect x="0" y="0" width="374" height="152" rx="12" fill="url(#finazuGlow)"/>

    <!-- Status: Pílula integrada sem linha flutuante cortando -->
    <rect x="20" y="18" width="124" height="24" rx="6" fill="#0066FF" fill-opacity="0.12" stroke="#0066FF" stroke-width="0.8" stroke-opacity="0.4"/>
    <circle cx="32" cy="30" r="3" fill="#38BDF8"/>
    <text x="42" y="34" class="font-sans" font-size="10" font-weight="700" fill="#38BDF8" letter-spacing="0.8">LIVE PRODUCT</text>

    <!-- Tag Categoria -->
    <rect x="290" y="18" width="64" height="24" rx="6" fill="#141923" stroke="#252D3D" stroke-width="0.8"/>
    <text x="322" y="34" text-anchor="middle" class="font-sans" font-size="10" font-weight="600" fill="#60A5FA">FINTECH</text>

    <!-- Nome -->
    <text x="20" y="76" class="font-sans" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="-0.3">Finazu</text>
    
    <!-- Descrição -->
    <text x="20" y="98" class="font-sans" font-size="12" font-weight="400" fill="#94A3B8">
      Solução moderna para inteligência e gestão financeira.
    </text>

    <!-- Divisória suave e Link -->
    <line x1="20" y1="116" x2="354" y2="116" stroke="#1E293B" stroke-width="0.8"/>
    <text x="20" y="135" class="font-mono" font-size="11" font-weight="600" fill="#38BDF8">↗ finazu.com.br</text>
    <text x="354" y="135" text-anchor="end" class="font-sans" font-size="10" font-weight="600" fill="#475569" letter-spacing="0.5">PRODUCTION</text>
  </g>

  <!-- CARD 2: L'OFERTAS -->
  <g transform="translate(446, 156)">
    <!-- Fundo do Card com borda integrada iluminada -->
    <rect x="0" y="0" width="374" height="152" rx="12" fill="#0c1017" stroke="url(#borderLofertas)" stroke-width="1.2"/>
    <rect x="0" y="0" width="374" height="152" rx="12" fill="url(#lofertasGlow)"/>

    <!-- Status: Pílula integrada sem linha flutuante cortando -->
    <rect x="20" y="18" width="124" height="24" rx="6" fill="#FF5500" fill-opacity="0.12" stroke="#FF5500" stroke-width="0.8" stroke-opacity="0.4"/>
    <circle cx="32" cy="30" r="3" fill="#FB923C"/>
    <text x="42" y="34" class="font-sans" font-size="10" font-weight="700" fill="#FB923C" letter-spacing="0.8">LIVE PRODUCT</text>

    <!-- Tag Categoria -->
    <rect x="290" y="18" width="64" height="24" rx="6" fill="#141923" stroke="#252D3D" stroke-width="0.8"/>
    <text x="322" y="34" text-anchor="middle" class="font-sans" font-size="10" font-weight="600" fill="#FB923C">E-COMM</text>

    <!-- Nome -->
    <text x="20" y="76" class="font-sans" font-size="22" font-weight="800" fill="#FFFFFF" letter-spacing="-0.3">L'ofertas</text>
    
    <!-- Descrição -->
    <text x="20" y="98" class="font-sans" font-size="12" font-weight="400" fill="#94A3B8">
      Plataforma inteligente de ofertas e oportunidades.
    </text>

    <!-- Divisória suave e Link -->
    <line x1="20" y1="116" x2="354" y2="116" stroke="#1E293B" stroke-width="0.8"/>
    <text x="20" y="135" class="font-mono" font-size="11" font-weight="600" fill="#FB923C">↗ lofertas.com.br</text>
    <text x="354" y="135" text-anchor="end" class="font-sans" font-size="10" font-weight="600" fill="#475569" letter-spacing="0.5">PRODUCTION</text>
  </g>

  <!-- RODAPÉ TÉCNICO INTERNO -->
  <g transform="translate(40, 334)">
    <text x="0" y="17" class="font-sans" font-size="10" font-weight="700" fill="#475569" letter-spacing="1">STACK MATRIX</text>
    
    <!-- Pills Modernas com cantos mais arredondados e fontes proporcionais -->
    <g transform="translate(100, 0)">
      <rect x="0" y="2" width="80" height="22" rx="11" fill="#111622" stroke="#1e293b" stroke-width="0.8"/>
      <text x="40" y="16" text-anchor="middle" class="font-sans" font-size="10" font-weight="600" fill="#94A3B8">TypeScript</text>

      <rect x="88" y="2" width="60" height="22" rx="11" fill="#111622" stroke="#1e293b" stroke-width="0.8"/>
      <text x="118" y="16" text-anchor="middle" class="font-sans" font-size="10" font-weight="600" fill="#94A3B8">React</text>

      <rect x="156" y="2" width="66" height="22" rx="11" fill="#111622" stroke="#1e293b" stroke-width="0.8"/>
      <text x="189" y="16" text-anchor="middle" class="font-sans" font-size="10" font-weight="600" fill="#94A3B8">Next.js</text>

      <rect x="230" y="2" width="66" height="22" rx="11" fill="#111622" stroke="#1e293b" stroke-width="0.8"/>
      <text x="263" y="16" text-anchor="middle" class="font-sans" font-size="10" font-weight="600" fill="#94A3B8">Node.js</text>

      <rect x="304" y="2" width="60" height="22" rx="11" fill="#111622" stroke="#1e293b" stroke-width="0.8"/>
      <text x="334" y="16" text-anchor="middle" class="font-sans" font-size="10" font-weight="600" fill="#94A3B8">Python</text>

      <rect x="372" y="2" width="82" height="22" rx="11" fill="#111622" stroke="#1e293b" stroke-width="0.8"/>
      <text x="413" y="16" text-anchor="middle" class="font-sans" font-size="10" font-weight="600" fill="#94A3B8">PostgreSQL</text>
    </g>

    <text x="780" y="17" text-anchor="end" class="font-mono" font-size="10" fill="#475569">v2.0 • LIVE</text>
  </g>
</svg>

